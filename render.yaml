services:
  # 1. FastAPI Web Service Backend Engine
  - type: web
    name: flamex-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: '["*"]'

  # 2. React Vite GIS Dashboard Frontend Static Site
  - type: web
    name: flamex-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://flamex-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
