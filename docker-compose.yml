version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: flamex_postgis
    environment:
      POSTGRES_USER: flamex_user
      POSTGRES_PASSWORD: flamex_password
      POSTGRES_DB: flamex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flamex_user -d flamex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: flamex_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://flamex_user:flamex_password@db:5432/flamex_db
      - ENV=production
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: flamex_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
